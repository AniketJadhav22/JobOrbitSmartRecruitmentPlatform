# ===================== JobOrbit - Smart Recruitment Platform =====================

server.port=8080
spring.application.name=joborbit-backend

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://localhost:3306/joborbit01?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Aniket@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# 256-bit+ secret required for HS256. Replace this in production and load from env var.
jwt.secret=ChangeThisJobOrbitSuperSecretKeyForJwtSigning2026!!
jwt.expiration-ms=86400000

# ---- File uploads ----
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.joborbit=DEBUG
